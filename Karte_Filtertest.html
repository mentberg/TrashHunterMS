<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sperrmüllabholung in Münster</title>
    <!-- Leaflet CSS einbinden -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <!-- MarkerCluster CSS einbinden -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />
    <style>
        /* Die Karte wird 100% der Höhe und Breite einnehmen */
        #map {
            height: 100vh;
            width: 100%;
        }
        /* Styling für das Dropdown */
        #filter {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: white;
            padding: 5px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <!-- Div für die Karte -->
    <div id="map"></div>

    <!-- Dropdown für Filter -->
    <div id="filter">
        <label for="filterSelect">Abholtermin:</label>
        <select id="filterSelect">
            <option value="">Alle Termine anzeigen</option>
            <!-- Option wird dynamisch gefüllt -->
        </select>
    </div>

    <!-- Leaflet und GeoJSON -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-ajax@1.1.0/dist/leaflet-ajax.js"></script>
    <!-- MarkerCluster Script einbinden -->
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

    <script>
        // Karte erstellen
        var map = L.map('map').setView([51.965, 7.625], 12);  // Startposition (Münster) und Zoom-Level

        // OpenStreetMap-Kachel-Layer hinzufügen
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // MarkerCluster Gruppe erstellen
        var markers = L.markerClusterGroup(); // Hier werden die Marker geclustert

        var allFeatures = [];  // Zum Speichern aller Features, damit wir filtern können
        var allMarkers = [];   // Zum Speichern aller Marker, um sie später zu filtern

        // Funktion, um GeoJSON-Daten zu laden
        fetch('sperrmull_abholung.geojson')
            .then(response => response.json())
            .then(data => {
                console.log("GeoJSON-Daten geladen:", data); // Debugging: Überprüfen, ob die Daten korrekt geladen wurden
                allFeatures = data.features; // Speichern der Daten für spätere Filterung
                addMarkersToCluster(data);  // Marker zum Cluster hinzufügen
                fillFilterOptions(data);  // Füllt das Dropdown mit Abholterminen
            })
            .catch(error => console.log('Fehler beim Laden der GeoJSON-Daten:', error));

        // Funktion zum Hinzufügen der Marker zum Cluster
        function addMarkersToCluster(data) {
            console.log("Füge Marker zum Cluster hinzu..."); // Debugging
            data.features.forEach(function(feature) {
                // Sicherstellen, dass die Geometrie und Koordinaten vorhanden sind
                if (feature.geometry && feature.geometry.type === 'Point' && feature.geometry.coordinates && feature.geometry.coordinates.length === 2) {
                    var coordinates = feature.geometry.coordinates;
                    if (coordinates[0] !== null && coordinates[1] !== null) {
                        var lat = coordinates[1];
                        var lng = coordinates[0];

                        // Erstellen eines Markers für jede Position
                        var marker = L.marker([lat, lng]);

                        // Popup für jeden Marker
                        var popupContent = "<b>Straße:</b> " + feature.properties.strasse_final + "<br>" +
                                           "<b>Abholtermin:</b> " + feature.properties.termin + "<br>" +
                                           "<b>Müllart:</b> " + feature.properties.muellart;
                        marker.bindPopup(popupContent);

                        // Hinzufügen des Markers zum Array für spätere Filterung
                        allMarkers.push({ marker: marker, feature: feature });
                        markers.addLayer(marker); // Alle Marker in den Cluster hinzufügen
                    }
                } else {
                    console.warn("Marker übersprungen, keine gültige Geometrie oder Koordinaten:", feature); // Debugging: Warnung bei fehlender Geometrie
                }
            });
            map.addLayer(markers); // Cluster zur Karte hinzufügen
            console.log("Marker hinzugefügt:", markers); // Debugging: Überprüfen, ob Marker hinzugefügt wurden
        }

        // Funktion, um das Datum im Format 'DD. MMMM YYYY' mit Wochentag 'Mo., Di.' zu formatieren
        function formatDate(dateString) {
            const date = new Date(dateString);  // Erstelle ein Date-Objekt
            const options = { 
                weekday: 'short', // Kürzel für den Wochentag (z.B. Mo., Di.)
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            };
            return date.toLocaleDateString('de-DE', options);  // Format: Mo., 06. Mai 2025
        }

        // Funktion, um das Filter-Dropdown dynamisch mit Terminen zu füllen (in chronologischer Reihenfolge)
        function fillFilterOptions(data) {
            console.log("Fülle Dropdown mit Abholterminen..."); // Debugging
            var select = document.getElementById('filterSelect');
            var terms = [...new Set(data.features.map(feature => feature.properties.termin))];  // Alle einzigartigen Termine

            // Termine in chronologischer Reihenfolge sortieren
            terms.sort((a, b) => new Date(a) - new Date(b));

            terms.forEach(term => {
                var formattedDate = formatDate(term); // Das Datum formatieren

                var option = document.createElement('option');
                option.value = term;
                option.text = formattedDate;  // Das formatierte Datum als Text setzen
                select.appendChild(option);
            });
            console.log("Dropdown mit Terminen gefüllt:", terms); // Debugging: Überprüfen, ob das Dropdown korrekt gefüllt wird
        }

        // Event-Listener für das Dropdown-Menü (Filter)
        document.getElementById('filterSelect').addEventListener('change', function() {
            var selectedDate = this.value;

            // Filtere die Marker je nach ausgewähltem Abholtermin
            var filteredData = selectedDate ? allMarkers.filter(item => item.feature.properties.termin === selectedDate) : allMarkers;

            // Entfernen der aktuellen Marker
            markers.clearLayers();

            // Hinzufügen der gefilterten Marker
            filteredData.forEach(function(item) {
                markers.addLayer(item.marker);
            });
        });
    </script>
</body>
</html>
